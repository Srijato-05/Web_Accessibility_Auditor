version: "3.8"

services:
  # 1. Graph Persistence Layer (Neo4j)
  neo4j:
    image: neo4j:5.12.0-community
    container_name: auditor-neo4j
    ports:
      - "7474:7474" # Neo4j Browser Console
      - "7687:7687" # Bolt protocol port
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Message Queue Layer
  redis:
    image: redis:7.2-alpine
    container_name: auditor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API Service (FastAPI)
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditor-backend-api
    ports:
      - "8000:7860"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./reports/data/audit_results.db
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - HOST=0.0.0.0
      - PORT=7860
    volumes:
      - backend_reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # 4. Asynchronous Audit Worker (Playwright Engine Node)
  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditor-backend-worker
    command: ["python", "src/auditor/batch_audit.py", "--worker"]
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./reports/data/audit_results.db
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - backend_reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # 5. Frontend Client Application (React / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditor-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend-api

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  backend_reports:
