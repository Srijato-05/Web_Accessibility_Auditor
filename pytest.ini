[pytest]
# Default execution arguments
addopts = -v --tb=short --strict-markers

# Configure async test execution
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Enable real-time logging output during testing
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers registry
markers =
    unit: Fast running isolated unit tests
    integration: Tests verifying system boundary integrations
    slow: Tests that execute third-party sub-processes (Playwright)

# Suppress known external/deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::sqlalchemy.exc.SAWarning
    ignore::RuntimeWarning
